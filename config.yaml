random_seed: 42
date_range:
  start: '2023-01-01'
  end: '2024-12-31'
  actual_start: '2023-01-01'
  actual_end: '2024-12-31'
  fallback_applied: false
  fallback_note: ''
thresholds:
  variance_pct: 0.05
  outlier_std: 4
  price_tolerance_dollars: 0.05
  timeliness_days: 10
paths:
  database: data/pipeline.db
  raw_dir: data/raw
  raw_csv: data/raw/iowa_sales.csv
  checkpoint: data/raw/pull_checkpoint.json
  feeds_dir: data/feeds
  reference_dir: data/reference
  output_dir: data/output
  docs_dir: docs
  excel_dir: excel
  readme: README.md
  profile_sql: sql/profile.sql
  profile_report: docs/data_profile.md
  distributor_map: data/reference/distributor_map.csv
  sku_crosswalk: data/reference/sku_crosswalk.csv
  defect_log: data/reference/defect_log.csv
  file_manifest: data/feeds/file_manifest.csv
  exceptions_csv: data/output/exceptions.csv
  scorecard_csv: data/output/dq_scorecard.csv
  detection_report: docs/detection_results.md
api:
  socrata_url: https://data.iowa.gov/resource/m3tr-qhgy.json
  page_size: 50000
  order: :id
  token_env: SOCRATA_APP_TOKEN
  max_runtime_minutes: 45
  retries: 5
  hub_base_url: https://idh-be.iowa.gov/api/v1/datasets
  hub_datasets:
  - year: 2023
    dataset_id: 1260
  - year: 2024
    dataset_id: 1261
columns:
  keep:
  - invoice_line_no
  - date
  - store
  - name
  - city
  - county
  - category
  - category_name
  - vendor_number
  - vendor_name
  - itemno
  - im_desc
  - pack
  - bottle_volume_ml
  - state_bottle_cost
  - state_bottle_retail
  - sale_bottles
  - sale_dollars
  - sale_liters
  numeric:
  - pack
  - bottle_volume_ml
  - state_bottle_cost
  - state_bottle_retail
  - sale_bottles
  - sale_dollars
  - sale_liters
  integer:
  - pack
  - sale_bottles
  hub_rename:
    invoice_id: invoice_line_no
    ordered_on: date
    store_no: store
    store_name: name
    store_city: city
    county_name: county
    category_code: category
    category_name: category_name
    vendor_number: vendor_number
    vendor_name: vendor_name
    item_no: itemno
    im_desc: im_desc
    pack: pack
    bottle_volume_ml: bottle_volume_ml
    state_bottle_cost: state_bottle_cost
    state_bottle_retail: state_bottle_retail
    sales_bottles: sale_bottles
    sales_dollars: sale_dollars
    sales_liters: sale_liters
pull:
  requested_source: socrata
  source_used: iowa_data_hub
  socrata_http_status: 404
  row_count: 5230532
  file_bytes: 937688453
  elapsed_seconds: 32.7
  datasets_loaded:
  - 2023
  - 2024

simulation:
  duplicate_rate: 0.02
  duplicate_distributors: [D01, D03, D06]
  missing_week_distributors: [D02, D05]
  missing_week_min: 3
  missing_week_max: 5
  unmapped_rate: 0.03
  unmapped_distributors: [D07, D08]
  negative_rate: 0.003
  negative_distributors: [D04]
  mixed_date_rate: 0.04
  mixed_date_distributors: [D03]
  mixed_date_format: "%Y-%m-%d"
  volume_shift_events: 4
  volume_shift_min: 0.08
  volume_shift_max: 0.15
  late_file_count: 2
  on_time_lag_days: 4
  late_lag_days: 21
  case_liters: 9
  xlsx_max_rows: 1000000

feeds:
  D01:
    file_glob: "D01_weekly.csv"
    kind: csv
    delimiter: ","
    date_format: "%Y-%m-%d"
    liters_per_reported_unit: 1
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: dist_id
      week_start: week_ending
      account_id: acct
      sku_id: sku
      volume: liters
      bottles: bottle_qty
      dollars: sales_amt
  D02:
    file_glob: "D02_weekly.csv"
    kind: csv
    delimiter: ","
    date_format: "%Y-%m-%d"
    liters_per_reported_unit: 1
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: distributor
      week_start: wk_start
      account_id: account_code
      sku_id: item_code
      volume: vol_l
      bottles: bottles
      dollars: dollars
  D03:
    file_glob: "D03_weekly.txt"
    kind: csv
    delimiter: "|"
    date_format: "%m/%d/%Y"
    liters_per_reported_unit: 1
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: DIST
      week_start: WEEK
      account_id: STORE
      sku_id: ITEM
      volume: LITERS
      bottles: BOTTLES
      dollars: DOLLARS
  D04:
    file_glob: "D04_weekly.txt"
    kind: csv
    delimiter: "|"
    date_format: "%m/%d/%Y"
    liters_per_reported_unit: 1
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: DistributorID
      week_start: WeekStart
      account_id: AccountID
      sku_id: SkuID
      volume: VolumeLiters
      bottles: BottleCount
      dollars: DollarSales
  D05:
    file_glob: "D05_weekly*.xlsx"
    kind: xlsx
    delimiter: ","
    date_format: "%d-%b-%y"
    liters_per_reported_unit: 9
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: Wholesaler
      week_start: Week Of
      account_id: Customer
      sku_id: Product
      volume: Cases
      bottles: Bottles
      dollars: Amount
  D06:
    file_glob: "D06_weekly*.xlsx"
    kind: xlsx
    delimiter: ","
    date_format: "%d-%b-%y"
    liters_per_reported_unit: 9
    strip_strings: false
    use_crosswalk: false
    columns:
      distributor_id: D_CODE
      week_start: PERIOD
      account_id: ACCT_NO
      sku_id: SKU_NO
      volume: CASE_VOL
      bottles: BTL
      dollars: DOLLARS
  D07:
    file_glob: "D07_weekly.csv"
    kind: csv
    delimiter: ","
    date_format: "%Y-%m-%d"
    liters_per_reported_unit: 1
    strip_strings: true
    use_crosswalk: true
    columns:
      distributor_id: distributor_code
      week_start: week_start
      account_id: account_id
      sku_id: dist_sku
      volume: volume_liters
      bottles: bottles
      dollars: dollars
  D08:
    file_glob: "D08_weekly.csv"
    kind: csv
    delimiter: ","
    date_format: "%Y-%m-%d"
    liters_per_reported_unit: 1
    strip_strings: true
    use_crosswalk: true
    columns:
      distributor_id: dist
      week_start: wk
      account_id: cust
      sku_id: dist_item
      volume: litres
      bottles: btls
      dollars: sales
